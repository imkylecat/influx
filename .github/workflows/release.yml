name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Check the tag matches package.json
        run: |
          version="$(jq -r .version package.json)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Check the changelog has an entry for this version
        run: bun scripts/changelog.ts "${GITHUB_REF_NAME}" > release-notes.md

      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: bun run typecheck
      - run: bun test
      - run: bun run build --release
      - run: bun run build:installer

      - name: Package the extension and checksum every asset
        working-directory: dist
        run: |
          (cd extension && zip -r ../release/influx-extension.zip .)
          cd release
          shasum -a 256 influx-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write the release notes
        run: |
          { echo "## What's changed"; echo; cat release-notes.md; echo; } > notes.md
          cat >> notes.md <<'EOF'
          ## Install

          Download the installer for your computer, quit Fluxer, run the installer, then reopen Fluxer.

          | System | File |
          | --- | --- |
          | macOS (Apple Silicon) | `influx-installer-macos-arm64` |
          | macOS (Intel) | `influx-installer-macos-x64` |
          | Windows | `influx-installer-windows-x64.exe` |
          | Linux (x64 / arm64) | `influx-installer-linux-x64` / `influx-installer-linux-arm64` |

          - **macOS:** the installer isn't notarized, so first run `xattr -d com.apple.quarantine ~/Downloads/influx-installer-macos-*` and `chmod +x ~/Downloads/influx-installer-macos-*` in Terminal, then run it there.
          - **Windows:** if SmartScreen says it doesn't recognize the app, choose *More info* → *Run anyway*.
          - **Linux:** `chmod +x` it and run it with `sudo` (Fluxer is installed in `/opt`).
          - Add `--canary` for Fluxer Canary (chosen automatically when it's the only Fluxer installed), `--uninstall` to remove Influx, or `--help` for every option.
          - **Browser:** unzip `influx-extension.zip` and load the folder as an unpacked extension.

          Influx updates itself after this. Fluxer's own updates remove it, so run the installer again after Fluxer updates.

          EOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/release/* --title "Influx ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes

      - name: Post the release to Fluxer
        env:
          FLUXER_WEBHOOK_URL: ${{ secrets.FLUXER_WEBHOOK_URL }}
        run: bun scripts/post-release.ts "${GITHUB_REF_NAME}" "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
